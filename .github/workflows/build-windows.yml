name: ChatGPT Windows Build

on:
  push:
    branches:
      - release/v3.3.5
      - codex/openai-compatible-tripo-p1
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixar-app3-release-v3.3.5-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MIXAR_ENV: Prod
      BUILD_CORES: 4
      ROBOCOPY_THREADS: 16
      PREVIEW_RELEASE_ASSET: mixar-3.3.5-codex-preview-windows-x64.zip
      PREVIEW_RELEASE_CHECKSUM: mixar-3.3.5-codex-preview-windows-x64.sha256

    steps:
      - name: Checkout Mixar source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Use all runner CPU cores
        shell: powershell
        run: |
          $detected = [Environment]::ProcessorCount
          if ($detected -lt 1) { $detected = 4 }

          $cores = [Math]::Max($detected, 4)
          $robocopyThreads = [Math]::Min([Math]::Max($cores * 4, 16), 128)

          "BUILD_CORES=$cores" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_BUILD_PARALLEL_LEVEL=$cores" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROBOCOPY_THREADS=$robocopyThreads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Detected logical CPUs : $detected"
          Write-Host "Compile jobs          : $cores"
          Write-Host "CMake parallel level  : $cores"
          Write-Host "Robocopy threads      : $robocopyThreads"

      - name: Validate Mixar release version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '3.3.5') {
            throw "VERSION must be 3.3.5 for release/v3.3.5, found: $version"
          }

          $parts = $version.Split('.')
          if ($parts.Count -ne 3) {
            throw "Invalid VERSION format: $version"
          }

          $packed = ([int]$parts[0] * 100) + [int]$parts[1]
          $patch = [int]$parts[2]
          $headerPath = 'src\source\blender\blenkernel\BKE_blender_version.h'
          $header = Get-Content $headerPath -Raw

          if ($header -notmatch "(?m)^#define\s+MIXAR_VERSION\s+$packed\s*$") {
            throw "MIXAR_VERSION in $headerPath does not match VERSION $version (expected $packed)"
          }
          if ($header -notmatch "(?m)^#define\s+MIXAR_VERSION_PATCH\s+$patch\s*$") {
            throw "MIXAR_VERSION_PATCH in $headerPath does not match VERSION $version (expected $patch)"
          }

          $env:MIXAR_VERSION = '3.3.2'
          $testConfig = Join-Path $env:RUNNER_TEMP 'mixar-version-test.json'
          python scripts/generate_config.py --output $testConfig
          if ($LASTEXITCODE -ne 0) {
            throw 'generate_config.py version test failed'
          }
          $config = Get-Content $testConfig -Raw | ConvertFrom-Json
          if ($config.app_info.version -ne '3.3.5') {
            throw "Bundled config would report $($config.app_info.version), expected 3.3.5"
          }
          Remove-Item Env:MIXAR_VERSION -ErrorAction SilentlyContinue

          Write-Host "Version synchronized: Mixar $version (MIXAR_VERSION=$packed, PATCH=$patch)"
          Write-Host "Bundled mixar.json version source is locked to VERSION=$version"

      - name: Normalize Windows batch files
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          Get-ChildItem -Path scripts\windows -Recurse -File | Where-Object { $_.Extension -in '.bat', '.cmd' } | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $text = $text -replace "`r?`n", "`r`n"
            [System.IO.File]::WriteAllText($_.FullName, $text, $utf8NoBom)
          }
          Write-Host 'Normalized repository batch scripts to CRLF.'

      - name: Install build helper tools
        shell: powershell
        run: |
          git lfs install
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            choco install subversion -y --no-progress
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          cmake --version
          ninja --version
          git lfs version
          svn --version --quiet
          make --version

      - name: Initialize Blender upstream and dependencies
        shell: cmd
        run: call scripts\windows\init.bat

      - name: Build Mixar Windows x64 (Prod)
        shell: cmd
        run: call scripts\windows\build_ninja.bat

      - name: Package Mixar 3.3.5 preview
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $PWD 'build\Prod\bin'

          if (-not (Test-Path $sourceDir -PathType Container)) {
            throw "Compiled output directory was not found: $sourceDir"
          }

          $files = Get-ChildItem -Path $sourceDir -Recurse -File
          if (-not $files) {
            throw "Compiled output directory is empty: $sourceDir"
          }

          Remove-Item $env:PREVIEW_RELEASE_ASSET -Force -ErrorAction SilentlyContinue
          Remove-Item $env:PREVIEW_RELEASE_CHECKSUM -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "$sourceDir\*" -DestinationPath $env:PREVIEW_RELEASE_ASSET -CompressionLevel Optimal

          $archive = Get-Item $env:PREVIEW_RELEASE_ASSET
          $hash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          "$hash  $env:PREVIEW_RELEASE_ASSET" | Set-Content -Path $env:PREVIEW_RELEASE_CHECKSUM -Encoding ascii

          Write-Host "Compiled files : $($files.Count)"
          Write-Host "Preview ZIP    : $($archive.FullName)"
          Write-Host "Archive bytes  : $($archive.Length)"
          Write-Host "SHA-256        : $hash"

      - name: Upload Mixar 3.3.5 preview to GoFile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = (Resolve-Path $env:PREVIEW_RELEASE_ASSET).Path

          Write-Host "Uploading $archive to GoFile (São Paulo)..."

          $response = & curl.exe `
            --fail-with-body `
            --silent `
            --show-error `
            --request POST `
            'https://upload-sa-sao.gofile.io/uploadfile' `
            --form "file=@$archive"

          if ($LASTEXITCODE -ne 0) {
            throw "GoFile upload failed with curl exit code $LASTEXITCODE"
          }

          try {
            $result = $response | ConvertFrom-Json
          }
          catch {
            Write-Host $response
            throw 'GoFile returned an invalid JSON response.'
          }

          if ($result.status -ne 'ok' -or -not $result.data.downloadPage) {
            Write-Host $response
            throw "GoFile upload failed with status: $($result.status)"
          }

          $downloadUrl = $result.data.downloadPage
          Write-Host ''
          Write-Host '============================================================'
          Write-Host 'MIXAR 3.3.5 DOWNLOAD'
          Write-Host $downloadUrl
          Write-Host '============================================================'

          "## Mixar 3.3.5 Codex Preview" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "**Download:** $downloadUrl" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "**File:** ``$env:PREVIEW_RELEASE_ASSET``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "**SHA-256:** ``$((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant())``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
