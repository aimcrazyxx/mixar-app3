name: ChatGPT Windows Build

on:
  push:
    branches:
      - release/v3.3.4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mixar-app3-release-v3.3.4-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MIXAR_ENV: Prod
      BUILD_CORES: 4
      ROBOCOPY_THREADS: 16

    steps:
      - name: Checkout Mixar source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Use all runner CPU cores
        shell: powershell
        run: |
          $detected = [Environment]::ProcessorCount
          if ($detected -lt 1) { $detected = 4 }

          $cores = [Math]::Max($detected, 4)
          $robocopyThreads = [Math]::Min([Math]::Max($cores * 4, 16), 128)

          "BUILD_CORES=$cores" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_BUILD_PARALLEL_LEVEL=$cores" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROBOCOPY_THREADS=$robocopyThreads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Detected logical CPUs : $detected"
          Write-Host "Compile jobs          : $cores"
          Write-Host "CMake parallel level  : $cores"
          Write-Host "Robocopy threads      : $robocopyThreads"

      - name: Validate Mixar release version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '3.3.4') {
            throw "VERSION must be 3.3.4 for release/v3.3.4, found: $version"
          }

          $parts = $version.Split('.')
          if ($parts.Count -ne 3) {
            throw "Invalid VERSION format: $version"
          }

          $packed = ([int]$parts[0] * 100) + [int]$parts[1]
          $patch = [int]$parts[2]
          $headerPath = 'src\source\blender\blenkernel\BKE_blender_version.h'
          $header = Get-Content $headerPath -Raw

          if ($header -notmatch "(?m)^#define\s+MIXAR_VERSION\s+$packed\s*$") {
            throw "MIXAR_VERSION in $headerPath does not match VERSION $version (expected $packed)"
          }
          if ($header -notmatch "(?m)^#define\s+MIXAR_VERSION_PATCH\s+$patch\s*$") {
            throw "MIXAR_VERSION_PATCH in $headerPath does not match VERSION $version (expected $patch)"
          }

          # Prove the bundled config cannot be forced back to an old version by
          # a stale CI/shell MIXAR_VERSION variable.
          $env:MIXAR_VERSION = '3.3.2'
          $testConfig = Join-Path $env:RUNNER_TEMP 'mixar-version-test.json'
          python scripts/generate_config.py --output $testConfig
          if ($LASTEXITCODE -ne 0) {
            throw 'generate_config.py version test failed'
          }
          $config = Get-Content $testConfig -Raw | ConvertFrom-Json
          if ($config.app_info.version -ne '3.3.4') {
            throw "Bundled config would report $($config.app_info.version), expected 3.3.4"
          }
          Remove-Item Env:MIXAR_VERSION -ErrorAction SilentlyContinue

          Write-Host "Version synchronized: Mixar $version (MIXAR_VERSION=$packed, PATCH=$patch)"
          Write-Host "Bundled mixar.json version source is locked to VERSION=$version"

      - name: Normalize Windows batch files
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          Get-ChildItem -Path scripts\windows -Recurse -File | Where-Object { $_.Extension -in '.bat', '.cmd' } | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $text = $text -replace "`r?`n", "`r`n"
            [System.IO.File]::WriteAllText($_.FullName, $text, $utf8NoBom)
          }
          Write-Host 'Normalized repository batch scripts to CRLF.'

      - name: Install build helper tools
        shell: powershell
        run: |
          git lfs install
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            choco install subversion -y --no-progress
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          cmake --version
          ninja --version
          git lfs version
          svn --version --quiet
          make --version

      - name: Initialize Blender upstream and dependencies
        shell: cmd
        run: call scripts\windows\init.bat

      - name: Build Mixar Windows x64 (Prod)
        shell: cmd
        run: call scripts\windows\build_ninja.bat

      - name: Upload compiled Mixar 3.3.4 immediately
        uses: actions/upload-artifact@v4
        with:
          name: mixar-3.3.4-windows-x64-prod
          path: build/Prod/bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Package Mixar 3.3.4 release
        shell: powershell
        run: |
          $asset = 'mixar-3.3.4-windows-x64-prod.zip'
          $checksum = 'mixar-3.3.4-windows-x64-prod.sha256'

          if (Test-Path $asset) { Remove-Item $asset -Force }
          if (Test-Path $checksum) { Remove-Item $checksum -Force }

          Compress-Archive -Path 'build\Prod\bin\*' -DestinationPath $asset -CompressionLevel Optimal
          if (-not (Test-Path $asset)) {
            throw "Release archive was not created: $asset"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path $checksum -Encoding ascii

          Write-Host "Release asset : $asset"
          Write-Host "SHA-256       : $hash"

      - name: Publish Mixar 3.3.4 to GitHub Releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v3.3.4'
          $asset = 'mixar-3.3.4-windows-x64-prod.zip'
          $checksum = 'mixar-3.3.4-windows-x64-prod.sha256'

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Release $tag already exists; replacing Windows assets."
            gh release upload $tag $asset $checksum --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload assets to existing release $tag"
            }
          }
          else {
            Write-Host "Creating release $tag from commit $env:GITHUB_SHA."
            gh release create $tag $asset $checksum `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'Mixar 3.3.4' `
              --notes 'Mixar 3.3.4 Windows x64 production build. Includes the compiled application bundle and SHA-256 checksum.'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $tag"
            }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY
