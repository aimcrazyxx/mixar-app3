# Builds the newest Mixar release (Mixar-AI/mixar-app: the newest vX.Y.Z tag
# or release/vX.Y.Z branch by default) for Windows x64 with this repository's
# patches/series - the same patches the Kaggle Linux build applies - and
# uploads build/Prod/bin as an artifact.
# Kaggle only runs Linux, so Windows builds happen here, on a hosted
# Windows runner (about 2.5 h on its 4 cores).

name: Windows build (newest Mixar)

on:
  workflow_dispatch:
    inputs:
      mixar_ref:
        description: "Official Mixar ref: latest-release (newest release), main (newest code), or a tag/branch such as v4.3.4"
        default: latest-release
        required: true
  # push, not pull_request: a pull_request paths filter matches the whole PR
  # diff, so every push to a PR that touches patches/ restarted the build.
  push:
    paths:
      - "patches/**"

concurrency:
  group: windows-build-latest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MIXAR_REF_REQUEST: ${{ inputs.mixar_ref || 'latest-release' }}

    steps:
      # Sets MIXAR_REF for the other steps. Mixar does not tag every release
      # (4.3.3 only has release/v4.3.3), so latest-release looks at tags and
      # release branches; when a version has both, the tag wins. Same rule as
      # kaggle/build_mixar_linux.sh.
      - name: Resolve the Mixar ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$MIXAR_REF_REQUEST"
          if [ "$ref" = latest-release ]; then
            ref="$(git ls-remote --refs https://github.com/Mixar-AI/mixar-app.git 'refs/tags/v*' 'refs/heads/release/v*' \
              | sed -E 's#.*refs/(tags|heads)/##' | grep -E '^(release/)?v[0-9]+\.[0-9]+\.[0-9]+$' \
              | awk '{ v = $0; sub(/^release\//, "", v); print v, ($0 ~ /^release/), $0 }' \
              | sort -k1,1V -k2,2nr | tail -n1 | cut -d' ' -f3)"
          fi
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid or missing Mixar ref: '$ref'" >&2; exit 1; }
          echo "Mixar ref: $ref"
          echo "MIXAR_REF=$ref" >> "$GITHUB_ENV"

      # Same layout as windows-build.yml: Mixar at the workspace root (its
      # .bat files need the runner's LF -> CRLF checkout), patches beside it.
      - name: Checkout the newest Mixar
        uses: actions/checkout@v4
        with:
          repository: Mixar-AI/mixar-app
          ref: ${{ env.MIXAR_REF }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout this repository's patches
        uses: actions/checkout@v4
        with:
          path: .mixar-app3

      # Mixar's releases carry the previous release's number in VERSION and
      # BKE_blender_version.h (v4.3.4 says 4.3.3, release/v4.3.3 says 4.3.2).
      # The app compares that number with the newest release to offer
      # updates, so a release build takes the number its tag or branch names
      # (as windows-build.yml did for v4.3.2).
      - name: Label the build with its release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = [regex]::Match($env:MIXAR_REF, '^(release/)?v(\d+)\.(\d+)\.(\d+)$')
          if (-not $release.Success) {
            Write-Host "$env:MIXAR_REF is not a release: keeping its VERSION"
            exit 0
          }
          $major, $minor, $patch = 2..4 | ForEach-Object { [int]$release.Groups[$_].Value }
          $version = "$major.$minor.$patch"
          $current = (Get-Content 'VERSION' -Raw).Trim()
          if ($current -eq $version) { exit 0 }
          $path = Join-Path $PWD 'src/source/blender/blenkernel/BKE_blender_version.h'
          $header = [IO.File]::ReadAllText($path)
          $defines = [ordered]@{ MIXAR_VERSION = $major * 100 + $minor; MIXAR_VERSION_PATCH = $patch }
          foreach ($name in $defines.Keys) {
            $pattern = '(?m)^#define ' + $name + ' \d+(?=\r?$)'
            if ($header -notmatch $pattern) { throw "No #define $name in $path" }
            $header = $header -replace $pattern, "#define $name $($defines[$name])"
          }
          [IO.File]::WriteAllText($path, $header)
          Set-Content -Path 'VERSION' -Value $version -Encoding utf8
          Write-Host "$env:MIXAR_REF says $current in VERSION and BKE_blender_version.h: building it as $version"

      - name: Show what is being built
        shell: pwsh
        run: |
          git log -1 --format='Mixar %h %s (%cs)'
          git -C upstream log -1 --format='Blender %h %s (%cs)'
          $version = (Get-Content 'VERSION' -Raw).Trim()
          "MIXAR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $version"

      - name: Apply patches/series
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content '.mixar-app3/patches/series') {
            $name = ($line -replace '#.*$', '').Trim()
            if (-not $name) { continue }
            # '?name': skipped with a warning once it stops applying (see the series header).
            $optional = $name.StartsWith('?')
            if ($optional) { $name = $name.Substring(1) }
            $patch = Join-Path '.mixar-app3/patches' $name
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              if ($optional) {
                Write-Warning "Skipped optional ${name}: it no longer applies"
                # The runner fails a step whose last native command failed.
                $global:LASTEXITCODE = 0
                continue
              }
              throw "$name no longer applies to Mixar $env:MIXAR_REF; rebase it onto the new version"
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw "Could not apply $name" }
            Write-Host "applied $name"
          }

      - name: Set up Python 3.13 (Blender 5.2's) for the patch tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test the patched modules
        shell: pwsh
        run: |
          # The BYOK suite imports cryptography (sealed keys) and the rest of
          # the app's runtime packages, so install exactly what the app bundles.
          python -m pip install pytest -r scripts/python_requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          # The suites of the modules the patches change (byok client, state,
          # operators, dialog, props; the 500-line rule; the paint fallback).
          # Not all of test_byok*: upstream's codex_auth and models_cache
          # suites assume POSIX paths and file modes and fail on Windows
          # whether or not anything is patched.
          $tests = @(@(
            'tests/test_byok_api_key.py',
            'tests/test_byok_custom_endpoint.py',
            'tests/test_byok_dialog_ui.py',
            'tests/test_byok_key_store.py',
            'tests/test_byok_provider_sheet.py',
            'tests/test_byok_request_lifecycle.py',
            'tests/test_byok_state_refresh.py',
            'tests/test_byok_transport_stale_retry.py',
            'tests/test_byok_turn_credentials.py',
            'tests/test_modal_dialog_hides_docks.py'
          ) | Where-Object { Test-Path $_ })
          if (Test-Path 'tests/test_procedural_materials_fallback.py') { $tests += 'tests/test_procedural_materials_fallback.py' }
          python -m pytest -q -p no:cacheprovider @tests
          if ($LASTEXITCODE -ne 0) { throw 'Patched-module tests failed' }

      - name: Disable OneAPI for the CPU runner
        shell: pwsh
        run: |
          $line = 'set(WITH_CYCLES_DEVICE_ONEAPI OFF CACHE BOOL "Disable Cycles Intel OneAPI device" FORCE)'
          Add-Content -Path 'cmake/mixar_overrides.cmake' -Value $line

      - name: Enable Git LFS
        shell: pwsh
        run: git lfs install --local

      - name: Initialize Blender and Windows libraries
        shell: cmd
        run: echo y| call scripts\\windows\\init.bat

      - name: Build Mixar (CPU)
        shell: cmd
        env:
          MIXAR_ENV: Prod
          MIXAR_CUDA: '0'
          MIXAR_CUDA_BINARIES: '0'
          BUILD_WITH_NINJA: '1'
        run: call scripts\\windows\\build_ninja.bat

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mixar-${{ env.MIXAR_VERSION }}-windows-x64-cpu
          path: build/Prod/bin/
          if-no-files-found: error
          retention-days: 14
