name: One-shot sync Mixar 4.0.0

on:
  push:
    branches:
      - release/v4.0.0

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace tree with official Mixar 4.0.0
        shell: bash
        run: |
          set -euo pipefail
          git remote add mixar-upstream https://github.com/Mixar-AI/mixar-app.git
          git fetch --no-tags mixar-upstream release/v4.0.0
          git rm -r --ignore-unmatch .
          git checkout mixar-upstream/release/v4.0.0 -- .
          git status --short

      - name: Commit synchronized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Tree already matches official Mixar 4.0.0."
            exit 0
          fi
          git commit -m "chore: sync official Mixar 4.0.0"
          git push origin HEAD:release/v4.0.0
