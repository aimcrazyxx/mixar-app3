name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout latest Mixar
        uses: actions/checkout@v4
        with:
          repository: Mixar-AI/mixar-app
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Apply device.py from mixar-app3
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/aimcrazyxx/mixar-app3/main/src/scripts/mixar/modules/auth/core/device.py"
          Invoke-WebRequest -Uri $url -OutFile "src/scripts/mixar/modules/auth/core/device.py"

      - name: Disable OneAPI for CPU runner
        shell: pwsh
        run: |
          $line = 'set(WITH_CYCLES_DEVICE_ONEAPI OFF CACHE BOOL "Disable Cycles Intel OneAPI device" FORCE)'
          Add-Content -Path 'cmake/mixar_overrides.cmake' -Value $line

      - name: Enable Git LFS
        shell: pwsh
        run: git lfs install --local

      - name: Initialize Blender and Windows libraries
        shell: cmd
        run: echo y| call scripts\\windows\\init.bat

      - name: Build latest Mixar (CPU)
        shell: cmd
        env:
          MIXAR_ENV: Prod
          MIXAR_CUDA: '0'
          MIXAR_CUDA_BINARIES: '0'
          BUILD_WITH_NINJA: '1'
        run: call scripts\\windows\\build_ninja.bat

      - name: Upload latest Mixar Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mixar-latest-windows-prod-cpu
          path: build/Prod/bin/
          if-no-files-found: error
          retention-days: 14
