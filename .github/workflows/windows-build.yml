name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout latest Mixar
        uses: actions/checkout@v4
        with:
          repository: Mixar-AI/mixar-app
          ref: v4.3.2
          submodules: recursive
          fetch-depth: 1


      - name: Correct stale version metadata in official v4.3.2 tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'VERSION' -Raw).Trim()
          if ($version -notin @('4.3.1', '4.3.2')) { throw "Unexpected source version: $version" }
          Set-Content -Path 'VERSION' -Value '4.3.2' -Encoding utf8
          $path = 'src/source/blender/blenkernel/BKE_blender_version.h'
          $header = Get-Content $path -Raw
          if ($header -notmatch '#define MIXAR_VERSION 403') { throw 'Unexpected Mixar major/minor version' }
          $header = $header.Replace('#define MIXAR_VERSION_PATCH 1', '#define MIXAR_VERSION_PATCH 2')
          if ($header -notmatch '#define MIXAR_VERSION_PATCH 2') { throw 'Version correction failed' }
          Set-Content -Path $path -Value $header -Encoding utf8
          git rev-parse HEAD
          Get-Content 'VERSION'

      - name: Apply device.py from mixar-app3
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/aimcrazyxx/mixar-app3/main/src/scripts/mixar/modules/auth/core/device.py"
          Invoke-WebRequest -Uri $url -OutFile "src/scripts/mixar/modules/auth/core/device.py"

      - name: Apply custom BYOK endpoint overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://raw.githubusercontent.com/aimcrazyxx/mixar-app3/21313bf3b2168217dd9f2b3c4f216d0e058c7db5/patches/byok-4.3.2.patch'
          $patch = Join-Path $env:RUNNER_TEMP 'byok-4.3.2.patch'
          Invoke-WebRequest -Uri $url -OutFile $patch
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'BYOK patch does not match upstream v4.3.2' }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply BYOK patch' }

      - name: Verify custom BYOK
        shell: pwsh
        run: |
          python -m pip install pytest requests
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          python -m compileall -q src/scripts/mixar/modules/byok
          if ($LASTEXITCODE -ne 0) { throw 'BYOK compilation failed' }
          python -m pytest -q tests/test_byok_custom_endpoint.py tests/test_byok_request_lifecycle.py tests/test_byok_turn_credentials.py tests/test_byok_key_store.py tests/test_byok_provider_sheet.py tests/test_byok_state_refresh.py tests/test_byok_api_key.py
          if ($LASTEXITCODE -ne 0) { throw 'BYOK tests failed' }

      - name: Disable OneAPI for CPU runner
        shell: pwsh
        run: |
          $line = 'set(WITH_CYCLES_DEVICE_ONEAPI OFF CACHE BOOL "Disable Cycles Intel OneAPI device" FORCE)'
          Add-Content -Path 'cmake/mixar_overrides.cmake' -Value $line

      - name: Enable Git LFS
        shell: pwsh
        run: git lfs install --local

      - name: Initialize Blender and Windows libraries
        shell: cmd
        run: echo y| call scripts\\windows\\init.bat

      - name: Build latest Mixar (CPU)
        shell: cmd
        env:
          MIXAR_ENV: Prod
          MIXAR_CUDA: '0'
          MIXAR_CUDA_BINARIES: '0'
          BUILD_WITH_NINJA: '1'
        run: call scripts\\windows\\build_ninja.bat

      - name: Upload latest Mixar Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mixar-4.3.2-windows-prod-cpu-byok
          path: build/Prod/bin/
          if-no-files-found: error
          retention-days: 14
