name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout latest Mixar
        uses: actions/checkout@v4
        with:
          repository: Mixar-AI/mixar-app
          ref: v4.2.3
          submodules: recursive
          fetch-depth: 1


      - name: Correct stale version metadata in official v4.2.3 tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'VERSION' -Raw).Trim()
          if ($version -notin @('4.2.2', '4.2.3')) { throw "Unexpected source version: $version" }
          Set-Content -Path 'VERSION' -Value '4.2.3' -Encoding utf8
          $path = 'src/source/blender/blenkernel/BKE_blender_version.h'
          $header = Get-Content $path -Raw
          if ($header -notmatch '#define MIXAR_VERSION 402') { throw 'Unexpected Mixar major/minor version' }
          $header = $header.Replace('#define MIXAR_VERSION_PATCH 2', '#define MIXAR_VERSION_PATCH 3')
          if ($header -notmatch '#define MIXAR_VERSION_PATCH 3') { throw 'Version correction failed' }
          Set-Content -Path $path -Value $header -Encoding utf8
          git rev-parse HEAD
          Get-Content 'VERSION'

      - name: Apply device.py from mixar-app3
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/aimcrazyxx/mixar-app3/main/src/scripts/mixar/modules/auth/core/device.py"
          Invoke-WebRequest -Uri $url -OutFile "src/scripts/mixar/modules/auth/core/device.py"

      - name: Disable OneAPI for CPU runner
        shell: pwsh
        run: |
          $line = 'set(WITH_CYCLES_DEVICE_ONEAPI OFF CACHE BOOL "Disable Cycles Intel OneAPI device" FORCE)'
          Add-Content -Path 'cmake/mixar_overrides.cmake' -Value $line

      - name: Enable Git LFS
        shell: pwsh
        run: git lfs install --local

      - name: Initialize Blender and Windows libraries
        shell: cmd
        run: echo y| call scripts\\windows\\init.bat

      - name: Build latest Mixar (CPU)
        shell: cmd
        env:
          MIXAR_ENV: Prod
          MIXAR_CUDA: '0'
          MIXAR_CUDA_BINARIES: '0'
          BUILD_WITH_NINJA: '1'
        run: call scripts\\windows\\build_ninja.bat

      - name: Upload latest Mixar Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mixar-4.2.3-windows-prod-cpu
          path: build/Prod/bin/
          if-no-files-found: error
          retention-days: 14
, '#define MIXAR_VERSION_PATCH 3'
          if ($header -notmatch '#define MIXAR_VERSION_PATCH 3') { throw 'Version patch correction failed' }
          Set-Content -Path $path -Value $header -Encoding utf8
          git rev-parse HEAD
          Get-Content 'VERSION'

      - name: Apply device.py from mixar-app3
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/aimcrazyxx/mixar-app3/main/src/scripts/mixar/modules/auth/core/device.py"
          Invoke-WebRequest -Uri $url -OutFile "src/scripts/mixar/modules/auth/core/device.py"

      - name: Disable OneAPI for CPU runner
        shell: pwsh
        run: |
          $line = 'set(WITH_CYCLES_DEVICE_ONEAPI OFF CACHE BOOL "Disable Cycles Intel OneAPI device" FORCE)'
          Add-Content -Path 'cmake/mixar_overrides.cmake' -Value $line

      - name: Enable Git LFS
        shell: pwsh
        run: git lfs install --local

      - name: Initialize Blender and Windows libraries
        shell: cmd
        run: echo y| call scripts\\windows\\init.bat

      - name: Build latest Mixar (CPU)
        shell: cmd
        env:
          MIXAR_ENV: Prod
          MIXAR_CUDA: '0'
          MIXAR_CUDA_BINARIES: '0'
          BUILD_WITH_NINJA: '1'
        run: call scripts\\windows\\build_ninja.bat

      - name: Upload latest Mixar Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mixar-4.2.3-windows-prod-cpu
          path: build/Prod/bin/
          if-no-files-found: error
          retention-days: 14
